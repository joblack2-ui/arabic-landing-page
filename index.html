<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأثر</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0f;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
      color: #aaa;
      margin-bottom: 35px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 16px;
      border: 1px solid #333;
      border-radius: 14px;
      background: #15151b;
      color: white;
      font-size: 17px;
      resize: vertical;
      outline: none;
      margin-bottom: 15px;
      font-family: Arial, sans-serif;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 16px 32px;
      font-size: 18px;
      cursor: pointer;
      background: white;
      color: #111;
      margin: 5px;
      transition: all 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary-btn {
      background: #2a2a3a;
      color: #ddd;
      font-size: 14px;
      padding: 12px 20px;
    }

    #form {
      display: none;
    }

    #saved {
      display: none;
      margin-top: 30px;
      padding: 20px;
      border-radius: 14px;
      background: #15151b;
      color: #ddd;
      line-height: 1.8;
      white-space: pre-wrap;
      text-align: right;
      border: 1px solid #2a2a3a;
    }

    .success {
      color: #77ff77;
      margin-top: 15px;
      font-size: 14px;
    }

    .error {
      color: #ff7777;
      margin-top: 15px;
      font-size: 14px;
    }

    .warning {
      color: #ffbb77;
      margin-top: 15px;
      font-size: 14px;
    }

    .loading {
      color: #aaa;
      margin-top: 15px;
      font-size: 14px;
    }

    .offline-notice {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>الأثر</h1>

    <p>
      بعض الأشياء لا ينبغي أن تصل الآن.
      <br>
      اترك شيئًا للمستقبل.
    </p>

    <button id="startButton" onclick="start()">
      اترك أثرًا
    </button>

    <div id="form">
      <textarea id="message" placeholder="اكتب أثرك هنا..."></textarea>

      <br>

      <button id="saveBtn" onclick="saveTrace()" disabled>
        حفظ الأثر
      </button>

      <button onclick="cancel()">
        إلغاء
      </button>

      <div id="status"></div>

    </div>

    <div id="saved"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://wkhpgcwevnkmrtnytmbk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_lr9IOVlibgbCWNqL3eknLQ_Oe0FIwvR";
    const STORAGE_KEY = "traces_backup";

    // تفعيل زر الحفظ عند كتابة النص
    document.addEventListener('DOMContentLoaded', function() {
      const textarea = document.getElementById("message");
      if (textarea) {
        textarea.addEventListener('input', function() {
          const saveBtn = document.getElementById("saveBtn");
          if (saveBtn) {
            saveBtn.disabled = this.value.trim().length === 0;
          }
        });
      }

      // التحقق من حالة الاتصال
      checkConnectionStatus();
      window.addEventListener('online', checkConnectionStatus);
      window.addEventListener('offline', checkConnectionStatus);
    });

    function checkConnectionStatus() {
      const isOnline = navigator.onLine;
      console.log("حالة الاتصال:", isOnline ? "متصل" : "غير متصل");
    }

    async function saveTrace() {
      const message = document.getElementById("message").value.trim();
      const status = document.getElementById("status");
      const saveBtn = document.getElementById("saveBtn");

      if (!message) {
        status.textContent = "اكتب شيئًا أولًا...";
        status.className = "error";
        return;
      }

      saveBtn.disabled = true;
      status.textContent = "جارٍ حفظ الأثر...";
      status.className = "loading";

      try {
        // محاولة الحفظ في Supabase
        const response = await Promise.race([
          fetch(SUPABASE_URL + "/rest/v1/traces", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY,
              "Prefer": "return=representation"
            },
            body: JSON.stringify({
              message: message,
              created_at: new Date().toISOString()
            })
          }),
          // مهلة زمنية 8 ثوان
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error("timeout")), 8000)
          )
        ]);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const responseText = await response.text();
        let data;

        if (responseText) {
          try {
            data = JSON.parse(responseText);
          } catch (e) {
            data = { message: message };
          }
        } else {
          data = { message: message };
        }

        // حفظ محلي كنسخة احتياطية
        saveLocally(message);

        status.textContent = "✓ تم حفظ الأثر بنجاح!";
        status.className = "success";

        document.getElementById("message").value = "";
        saveBtn.disabled = true;

        showSaved(data[0] || data);

      } catch (error) {
        console.error("خطأ:", error);

        // محاولة الحفظ المحلي كبديل
        try {
          saveLocally(message);
          
          status.innerHTML = "⚠️ تم حفظ الأثر محليًا<br><small>سيتم مزامجته عند الاتصال</small>";
          status.className = "warning";

          document.getElementById("message").value = "";
          saveBtn.disabled = true;

          showSaved({ message: message });
        } catch (localError) {
          let errorMessage = "حدث خطأ أثناء حفظ الأثر";

          if (error.message === "timeout") {
            errorMessage = "❌ انتهت مهلة الاتصال - حاول مرة أخرى";
          } else if (!navigator.onLine) {
            errorMessage = "❌ لا توجد اتصال إنترنت";
          } else if (error.message.includes("Failed to fetch") || error.message.includes("CORS")) {
            errorMessage = "❌ مشكلة في الاتصال - تحقق من الإعدادات";
          } else if (error.message.includes("401")) {
            errorMessage = "❌ مشكلة في المصادقة";
          } else if (error.message.includes("403")) {
            errorMessage = "❌ ليس لديك صلاحية للكتابة";
          } else if (error.message.includes("404")) {
            errorMessage = "❌ الخادم غير متاح";
          } else {
            errorMessage = "❌ " + error.message;
          }

          status.textContent = errorMessage;
          status.className = "error";
          saveBtn.disabled = false;
        }
      }
    }

    function saveLocally(message) {
      try {
        const traces = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        traces.push({
          message: message,
          timestamp: new Date().toISOString(),
          synced: false
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(traces));
        console.log("تم الحفظ محليًا بنجاح");
      } catch (e) {
        console.error("خطأ في الحفظ المحلي:", e);
        throw e;
      }
    }

    function showSaved(trace) {
      if (!trace) return;

      const box = document.getElementById("saved");
      const message = typeof trace === 'string' ? trace : trace.message;

      box.textContent = "أثرك المحفوظ:\n\n" + message;
      box.style.display = "block";
    }

    function start() {
      document.getElementById("form").style.display = "block";
      document.getElementById("startButton").style.display = "none";
      document.getElementById("saved").style.display = "none";
      document.getElementById("status").textContent = "";
      document.getElementById("message").focus();
    }

    function cancel() {
      document.getElementById("form").style.display = "none";
      document.getElementById("startButton").style.display = "inline-block";
      document.getElementById("status").textContent = "";
    }
  </script>
</body>
</html>
