<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأثر</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0f;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
      color: #aaa;
      margin-bottom: 35px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 16px;
      border: 1px solid #333;
      border-radius: 14px;
      background: #15151b;
      color: white;
      font-size: 17px;
      resize: vertical;
      outline: none;
      margin-bottom: 15px;
      font-family: Arial, sans-serif;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 16px 32px;
      font-size: 18px;
      cursor: pointer;
      background: white;
      color: #111;
      margin: 5px;
    }

    button:active {
      transform: scale(0.97);
    }

    #form {
      display: none;
    }

    #saved {
      display: none;
      margin-top: 30px;
      padding: 20px;
      border-radius: 14px;
      background: #15151b;
      color: #ddd;
      line-height: 1.8;
      white-space: pre-wrap;
      text-align: right;
    }

    .success {
      color: #aaa;
      margin-top: 15px;
    }

    .error {
      color: #ff7777;
      margin-top: 15px;
    }
  </style></head><body>  <div class="container"><h1>الأثر</h1>

<p>
  بعض الأشياء لا ينبغي أن تصل الآن.
  <br>
  اترك شيئًا للمستقبل.
</p>

<button id="startButton" onclick="start()">
  اترك أثرًا
</button>

<div id="form">

  <textarea id="message" placeholder="اكتب أثرك هنا..."></textarea>

  <br>

  <button onclick="saveTrace()">
    حفظ الأثر
  </button>

  <button onclick="cancel()">
    إلغاء
  </button>

  <div id="status"></div>

</div>

<div id="saved"></div>

  </div>  <script>
    const SUPABASE_URL =
      "https://wkhpgcwevnkmrtnytmbk.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_lr9IOVlibgbCWNqL3eknLQ_Oe0FIwvR";

    async function saveTrace() {

      const message =
        document.getElementById("message").value.trim();

      const status =
        document.getElementById("status");

      if (!message) {
        status.textContent = "اكتب شيئًا أولًا...";
        status.className = "error";
        return;
      }

      status.textContent = "جارٍ حفظ الأثر...";
      status.className = "success";

      try {

        const response = await fetch(
          SUPABASE_URL + "/rest/v1/traces",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY,
              "Prefer": "return=representation"
            },

            body: JSON.stringify({
              message: message
            })
          }
        );

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText);
        }

        const data = await response.json();

        status.textContent = "تم حفظ الأثر بنجاح.";
        status.className = "success";

        document.getElementById("message").value = "";

        showSaved(data[0]);

      } catch (error) {

        console.error(error);

        status.textContent =
          "حدث خطأ أثناء حفظ الأثر.";

        status.className = "error";
      }
    }

    function showSaved(trace) {

      if (!trace) return;

      const box =
        document.getElementById("saved");

      box.textContent =
        "أثرك المحفوظ:\n\n" +
        trace.message;

      box.style.display = "block";
    }

    function start() {

      document.getElementById("form").style.display =
        "block";

      document.getElementById("startButton").style.display =
        "none";

      document.getElementById("message").focus();
    }

    function cancel() {

      document.getElementById("form").style.display =
        "none";

      document.getElementById("startButton").style.display =
        "inline-block";
    }
  </script></body>
</html>
